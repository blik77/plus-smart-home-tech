spring:
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000
  main:
    banner-mode: off
    log-startup-info: false
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    ru:
      yandex:
        practicum:
          telemetry: WARN
          analyzer: DEBUG
          aggregator: DEBUG
    org:
      springframework: ERROR
      apache:
        kafka: WARN

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/