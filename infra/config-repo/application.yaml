spring:
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000
    client:
      config:
        default: # применяется по умолчанию для всех клиентов (можно указать имя @FeignClient вместо default)
          connectTimeout: 3000 # 3 cek - Это время подключения
          readTimeout: 3000 # 3 cek - Это время получения ответа
          loggerLevel: basic
  main:
    banner-mode: off
    log-startup-info: false
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    ru:
      yandex:
        practicum:
          inventory: DEBUG
          order: DEBUG
          product: DEBUG
          telemetry: DEBUG
          analyzer: DEBUG
          aggregator: DEBUG
    org:
      springframework: ERROR
      apache:
        kafka: WARN

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/